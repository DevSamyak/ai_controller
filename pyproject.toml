[project]
name = "ai-operator"
version = "0.1.0"
description = "AI Employee / Autonomous Company Operator proof of concept"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: requires a configured Gemini API key and network access",
]

[tool.ruff]
line-length = 120
